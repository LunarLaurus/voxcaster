[package]
name = "voxcaster"
version = "0.1.0"
edition = "2021"
description = "MCP server providing persistent interactive PTY sessions to an AI agent"
license = "MIT"

[[bin]]
name = "voxcaster"
path = "src/main.rs"

[lib]
name = "voxcaster"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
globset = "0.4"
toml = "0.8"
strip-ansi-escapes = "0.2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
rmcp = { version = "1", features = ["client", "transport-child-process"] }
serde_json = "1"
