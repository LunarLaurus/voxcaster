[package]
name = "voxcaster"
version = "0.1.0"
edition = "2021"
description = "MCP server providing persistent interactive PTY sessions to an AI agent"
license = "MIT"

[[bin]]
name = "voxcaster"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
globset = "0.4"
toml = "0.8"
strip-ansi-escapes = "0.2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[patch.crates-io]
# portable-pty 0.9.0 sets PSEUDOCONSOLE_WIN32_INPUT_MODE which is not supported
# on Windows 10 (build < 22000) and causes all ConPTY children to exit with
# STATUS_NOT_IMPLEMENTED (0xC000_0002).  The local patch removes that flag.
portable-pty = { path = "vendor/portable-pty" }
