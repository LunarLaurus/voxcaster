name: Shell Lint

on:
  push:
    branches: ["master", "main"]
    paths:
      - "**.sh"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["master", "main"]
    paths:
      - "**.sh"

jobs:
  shell-lint:
    name: Shell Lint
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Find shell scripts
        id: find
        run: |
          SCRIPTS=$(find . -name "*.sh" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./.gitea/*")
          if [ -z "$SCRIPTS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No .sh files found -- skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$SCRIPTS" > /tmp/shell-files.txt
            echo "Found $(wc -l < /tmp/shell-files.txt) shell scripts"
          fi

      - name: Install shellcheck
        if: steps.find.outputs.skip != 'true'
        run: apt-get update -qq && apt-get install -y -qq shellcheck

      - name: Shellcheck
        if: steps.find.outputs.skip != 'true'
        run: |
          FAILED=0
          while IFS= read -r f; do
            echo "Checking: $f"
            shellcheck -S warning "$f" || FAILED=1
          done < /tmp/shell-files.txt
          if [ "$FAILED" -ne 0 ]; then
            echo "Shellcheck found warnings -- see above"
            exit 1
          fi
