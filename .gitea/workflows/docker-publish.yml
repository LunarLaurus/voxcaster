name: Docker Publish (on tag)

# Builds and pushes the project's Docker image to the fleet registry
# whenever a semver `v*` tag is pushed. Pushes both the exact version
# tag and `:latest`. Closes the registry-drift gap where the
# version-bump workflow creates a tag in git but no one rebuilds the
# image, so the registry shows stale tags compared to the codebase.
#
# Auth: Bosun (CI service account). The Bosun token must be available
# as the FLEET_REGISTRY_TOKEN secret on the repo.
#
# Expected Dockerfile location: repo root.
# Image name: ${{ github.repository }} → e.g. StellarFleetOps/fleet-ci.
# The image is namespaced as the lowercase org/repo under the registry:
#   192.168.0.12:30008/stellarfleetops/fleet-ci:v0.5.0
#   192.168.0.12:30008/stellarfleetops/fleet-ci:latest
#
# Synced from lex-flows. Do not edit per-repo — change the template.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  FLEET_REGISTRY: "192.168.0.12:30008"

jobs:
  publish:
    name: Build + push image
    runs-on: fleet-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ ! -f Dockerfile ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile in repo root -- skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image name from repo
        if: steps.check.outputs.skip != 'true'
        id: image
        run: |
          # github.repository is "Owner/Repo" -- lowercase for registry use.
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          IMAGE="${FLEET_REGISTRY}/${OWNER}/${NAME}"
          TAG="${{ github.ref_name }}"           # e.g. v0.5.0
          BARE_TAG="${TAG#v}"                    # e.g. 0.5.0
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare_tag=$BARE_TAG" >> "$GITHUB_OUTPUT"
          echo "Pushing $IMAGE:$TAG and :$BARE_TAG and :latest"

      - name: Login to fleet registry as Bosun
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.FLEET_REGISTRY_TOKEN }}" ]; then
            echo "::error::FLEET_REGISTRY_TOKEN secret not set on repo"
            echo "Add via: lex-gitea secrets set ${{ github.repository }} FLEET_REGISTRY_TOKEN <bosun-token>"
            exit 1
          fi
          echo "${{ secrets.FLEET_REGISTRY_TOKEN }}" | docker login "$FLEET_REGISTRY" -u Bosun --password-stdin

      - name: Build + push tagged + latest
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.image }}"
          TAG="${{ steps.image.outputs.tag }}"
          BARE_TAG="${{ steps.image.outputs.bare_tag }}"

          docker build \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$BARE_TAG" \
            -t "$IMAGE:latest" \
            .

          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$BARE_TAG"
          docker push "$IMAGE:latest"

          echo "Published:"
          echo "  $IMAGE:$TAG"
          echo "  $IMAGE:$BARE_TAG"
          echo "  $IMAGE:latest"
