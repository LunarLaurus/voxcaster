name: Version Label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: ["master", "main"]

jobs:
  label-check:
    name: Version Label
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - name: Check for version label (patch/minor/major)
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -qE '"(patch|minor|major)"'; then
            echo "Version label found"
          else
            echo "ERROR: PR must have a version label (patch, minor, or major)"
            echo "Add one via: lex-gitea issue label <owner/name> <pr-number> --add patch"
            exit 1
          fi
      - name: Check for type label (type/feature, type/bug, etc.)
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -qE '"type/'; then
            echo "Type label found"
          else
            echo "ERROR: PR must have a type label (type/feature, type/bug, type/enhancement, etc.)"
            echo "Add one via: lex-gitea issue label <owner/name> <pr-number> --add type/feature"
            exit 1
          fi
