name: Version Bump (on merge only)

on:
  pull_request:
    types: [closed]
    branches: ["master", "main"]

jobs:
  version-bump:
    name: Version Bump (on merge only)
    if: github.event.pull_request.merged == true
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FLEET_TOKEN }}

      - name: Determine bump type from PR labels
        id: bump
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and tag
        id: version
        run: |
          set -euo pipefail
          TYPE="${{ steps.bump.outputs.type }}"
          if [ ! -f VERSION ]; then echo "0.1.0" > VERSION; fi
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          LATEST_TAG=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)
          if [ -n "$LATEST_TAG" ]; then
            HIGHER=$(printf '%s\n%s\n' "$CURRENT" "$LATEST_TAG" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            CURRENT="$HIGHER"
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "$TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          if git tag -l "v${NEW}" | grep -q .; then
            echo "Tag v${NEW} already exists -- skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$NEW" > VERSION
          git config user.name "Bosun"
          git config user.email "bosun@guth.ix"
          git add VERSION
          git commit -m "chore: bump version to ${NEW} [skip ci]"
          git tag "v${NEW}"
          REPO="${{ github.repository }}"
          REMOTE_URL="http://Bosun:${{ secrets.FLEET_TOKEN }}@192.168.0.12:30008/${REPO}.git"
          git remote set-url origin "${REMOTE_URL}"
          BASE="${{ github.event.pull_request.base.ref }}"
          git push origin "HEAD:${BASE}"
          git push origin "v${NEW}"
          echo "new_version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "new_tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Detect language
        if: steps.version.outputs.skipped != 'true'
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "lang=go" >> "$GITHUB_OUTPUT"
          elif [ -f Cargo.toml ]; then
            echo "lang=rust" >> "$GITHUB_OUTPUT"
          elif [ -f Dockerfile ]; then
            echo "lang=docker" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "lang=python" >> "$GITHUB_OUTPUT"
          else
            echo "lang=none" >> "$GITHUB_OUTPUT"
          fi

      # Go build and release
      - uses: actions/setup-go@v6
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure fleet registry
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'go'
        run: |
          echo "machine 192.168.0.12 login Bosun password ${{ secrets.FLEET_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."http://Bosun:${{ secrets.FLEET_TOKEN }}@192.168.0.12:30008/StellarFleetOps/".insteadOf "https://github.com/meridian-lex/"
          go env -w GONOSUMDB="github.com/meridian-lex/*" GOPRIVATE="github.com/meridian-lex/*" GOFLAGS=""

      - name: Build Go binary
        id: build
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'go'
        env:
          GONOSUMCHECK: "github.com/meridian-lex/*"
          GONOSUMDB: "github.com/meridian-lex/*"
          GOPRIVATE: "github.com/meridian-lex/*"
          GOFLAGS: ""
        run: |
          BINARY=$(echo "${{ github.repository }}" | cut -d/ -f2)
          TAG="${{ steps.version.outputs.new_tag }}"
          LDFLAGS="-X main.version=${TAG} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go mod download -x 2>&1 || true
          mkdir -p dist
          # Try cmd/${BINARY} first, then first cmd/*/main.go, then root main.go
          if [ -d "cmd/${BINARY}" ]; then
            GOOS=linux GOARCH=amd64 go build -mod=mod -ldflags "$LDFLAGS" -o "dist/${BINARY}-linux-amd64" "./cmd/${BINARY}"
          elif [ -d cmd ] && ls cmd/*/main.go > /dev/null 2>&1; then
            # Build the first cmd/ subpackage found (avoids multi-binary -o error)
            FIRST_CMD=$(ls -d cmd/*/main.go 2>/dev/null | head -1 | xargs dirname)
            GOOS=linux GOARCH=amd64 go build -mod=mod -ldflags "$LDFLAGS" -o "dist/${BINARY}-linux-amd64" "./${FIRST_CMD}"
          elif [ -f main.go ]; then
            GOOS=linux GOARCH=amd64 go build -mod=mod -ldflags "$LDFLAGS" -o "dist/${BINARY}-linux-amd64" .
          else
            echo "No buildable main package found -- skipping binary build"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "dist/${BINARY}-linux-amd64" ]; then
            chmod +x "dist/${BINARY}-linux-amd64"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.version.outputs.skipped != 'true'
        id: notes
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.FLEET_TOKEN }}"
          GITEA_URL="http://192.168.0.12:30008"
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          # Try the official changelog tool first (uses milestones + labels)
          if command -v changelog > /dev/null 2>&1 && [ -f .changelog.yml ]; then
            changelog generate -m="${TAG}" -t="${TOKEN}" > /tmp/release-notes.md 2>/dev/null || true
          fi

          # If changelog tool didn't produce output, build from PR metadata
          if [ ! -s /tmp/release-notes.md ]; then
            PREV_TAG=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -2 | head -1)
            echo "## ${TAG}" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md

            # Collect merged PRs since previous tag
            if [ -n "$PREV_TAG" ]; then
              PR_NUMS=$(git log "v${PREV_TAG}..HEAD" --oneline | grep -oP "Merge pull request.*#\K[0-9]+" | sort -un)
            else
              PR_NUMS="${{ github.event.pull_request.number }}"
            fi

            FEAT_FILE=$(mktemp) FIX_FILE=$(mktemp) OTHER_FILE=$(mktemp)
            for num in $PR_NUMS; do
              PR_DATA=$(curl -s -H "Authorization: token ${TOKEN}" "${GITEA_URL}/api/v1/repos/${REPO}/pulls/${num}" 2>/dev/null)
              TITLE=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))" 2>/dev/null)
              LABELS=$(echo "$PR_DATA" | python3 -c "import sys,json; print(' '.join(l['name'] for l in json.load(sys.stdin).get('labels',[])))" 2>/dev/null)
              if [ -z "$TITLE" ]; then continue; fi
              ENTRY="- ${TITLE} (#${num})"
              case "$LABELS" in
                *type/feature*|*type/enhancement*) echo "$ENTRY" >> "$FEAT_FILE" ;;
                *type/bug*|*type/security*) echo "$ENTRY" >> "$FIX_FILE" ;;
                *) echo "$ENTRY" >> "$OTHER_FILE" ;;
              esac
            done

            if [ -s "$FEAT_FILE" ]; then echo "" >> /tmp/release-notes.md; echo "### Features" >> /tmp/release-notes.md; cat "$FEAT_FILE" >> /tmp/release-notes.md; fi
            if [ -s "$FIX_FILE" ]; then echo "" >> /tmp/release-notes.md; echo "### Fixes" >> /tmp/release-notes.md; cat "$FIX_FILE" >> /tmp/release-notes.md; fi
            if [ -s "$OTHER_FILE" ]; then echo "" >> /tmp/release-notes.md; echo "### Other" >> /tmp/release-notes.md; cat "$OTHER_FILE" >> /tmp/release-notes.md; fi
            HAVE_ENTRIES=false
            if [ -s "$FEAT_FILE" ] || [ -s "$FIX_FILE" ] || [ -s "$OTHER_FILE" ]; then HAVE_ENTRIES=true; fi
            rm -f "$FEAT_FILE" "$FIX_FILE" "$OTHER_FILE"

            # Fallback
            if [ "$HAVE_ENTRIES" = "false" ]; then
              printf -- '- %s (#%s)\n' "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.number }}" >> /tmp/release-notes.md
            fi

            echo "" >> /tmp/release-notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "[Full changelog](${GITEA_URL}/${REPO}/compare/v${PREV_TAG}...${TAG})" >> /tmp/release-notes.md
            fi
          fi

      - name: Create Gitea release (Go)
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'go' && steps.build.outputs.skip_release != 'true'
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: http://192.168.0.12:30008
          token: ${{ secrets.FLEET_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: /tmp/release-notes.md
          files: |-
            dist/*
          sha256sum: true

      - name: Create Gitea release (library/no binary)
        if: steps.version.outputs.skipped != 'true' && (steps.detect.outputs.lang == 'none' || steps.build.outputs.skip_release == 'true')
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: http://192.168.0.12:30008
          token: ${{ secrets.FLEET_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: /tmp/release-notes.md

      - name: Publish Go module
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'go'
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          MODULE=$(head -1 go.mod | awk '{print $2}')
          mkdir -p ~/.config
          printf 'gitea:\n  url: http://192.168.0.12:30008\n  packages_token: "%s"\n  username: Bosun\n' \
            "${{ secrets.FLEET_TOKEN }}" > ~/.config/secrets.yaml
          go install github.com/meridian-lex/lexus/cmd/lexus@latest 2>/dev/null && \
            lexus publish go --module "${MODULE}" --version "${TAG}" || \
            echo "lexus publish skipped (not available or failed)"

      # Rust build and release
      - name: Install Rust toolchain
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'rust'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Rust binary
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'rust'
        run: |
          BINARY=$(echo "${{ github.repository }}" | cut -d/ -f2)
          mkdir -p dist
          cargo build --release
          cp "target/release/${BINARY}" "dist/${BINARY}-linux-amd64" 2>/dev/null || \
            find target/release -maxdepth 1 -type f -executable ! -name "*.d" | head -1 | xargs -I{} cp {} "dist/${BINARY}-linux-amd64"
          chmod +x "dist/${BINARY}-linux-amd64"

      - name: Create Gitea release (Rust)
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'rust'
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: http://192.168.0.12:30008
          token: ${{ secrets.FLEET_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: /tmp/release-notes.md
          files: |-
            dist/*
          sha256sum: true

      # Docker build and push
      # NOTE: Container builds require docker daemon access (socket mount or DinD).
      # The fleet act-runner does not provide this. Docker images must be built and
      # pushed manually from a machine with Docker access. This step succeeds
      # gracefully when docker is unavailable.
      - name: Build and push Docker image
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'docker'
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="192.168.0.12:30008"
          TOKEN="${{ secrets.FLEET_TOKEN }}"

          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            echo "WARNING: Docker daemon not available in CI runner."
            echo "Docker images must be built and pushed manually:"
            echo "  docker build -t ${REGISTRY}/${REPO}:${TAG} -t ${REGISTRY}/${REPO}:latest ."
            echo "  docker push ${REGISTRY}/${REPO}:${TAG}"
            echo "  docker push ${REGISTRY}/${REPO}:latest"
            echo "Version ${TAG} tagged. Image build skipped."
            exit 0
          fi

          echo "${TOKEN}" | docker login "${REGISTRY}" -u Bosun --password-stdin
          docker build \
            -t "${REGISTRY}/${REPO}:latest" \
            -t "${REGISTRY}/${REPO}:${TAG}" \
            .
          docker push "${REGISTRY}/${REPO}:latest"
          docker push "${REGISTRY}/${REPO}:${TAG}"
          echo "Pushed ${REGISTRY}/${REPO}:${TAG}"

      - name: Create Gitea release (Docker)
        if: steps.version.outputs.skipped != 'true' && steps.detect.outputs.lang == 'docker'
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: http://192.168.0.12:30008
          token: ${{ secrets.FLEET_TOKEN }}
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: /tmp/release-notes.md
