name: E2E Tests

on:
  push:
    branches: ["master", "main"]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.vue"
      - "**.svelte"
      - "playwright.config.*"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened]
    # No `branches:` filter — fire CI on any base, including stacked PRs
    # targeting a feature branch. Task 1301 fix. The push-side `branches:`
    # filter above stays: post-merge runs still gate on master/main only.
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.vue"
      - "**.svelte"
      - "playwright.config.*"
      - "package.json"

jobs:
  e2e:
    name: E2E Tests
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Detect test framework
        id: detect
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            echo "framework=playwright" >> "$GITHUB_OUTPUT"
          elif [ -f cypress.config.ts ] || [ -f cypress.config.js ] || [ -f cypress.json ]; then
            echo "framework=cypress" >> "$GITHUB_OUTPUT"
          elif [ -d e2e ] || [ -d tests/e2e ]; then
            echo "framework=generic" >> "$GITHUB_OUTPUT"
          else
            echo "framework=none" >> "$GITHUB_OUTPUT"
            echo "No E2E test framework detected -- skipping"
          fi

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.framework != 'none'
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.detect.outputs.framework != 'none'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Install Playwright browsers
        if: steps.detect.outputs.framework == 'playwright'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.detect.outputs.framework == 'playwright'
        run: npx playwright test

      - name: Run Cypress tests
        if: steps.detect.outputs.framework == 'cypress'
        run: npx cypress run

      - name: Run generic E2E tests
        if: steps.detect.outputs.framework == 'generic'
        run: |
          if [ -f package.json ] && grep -q '"test:e2e"' package.json; then
            npm run test:e2e
          elif [ -f package.json ] && grep -q '"e2e"' package.json; then
            npm run e2e
          else
            echo "No test:e2e or e2e script in package.json -- skipping"
          fi
