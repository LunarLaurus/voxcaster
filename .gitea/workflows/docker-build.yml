name: Docker Build Verification

on:
  push:
    branches: ["master", "main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
  pull_request:
    types: [opened, synchronize, reopened]
    # No `branches:` filter — fire CI on any base, including stacked PRs
    # targeting a feature branch. Task 1301 fix. The push-side `branches:`
    # filter above stays: post-merge runs still gate on master/main only.
    paths:
      - "Dockerfile"
      - ".dockerignore"

jobs:
  docker-build:
    name: Docker Build
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Validate Dockerfile syntax
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found -- skipping"
            exit 0
          fi
          if ! grep -q '^FROM ' Dockerfile; then
            echo "ERROR: Dockerfile missing FROM instruction"
            exit 1
          fi
          echo "Dockerfile syntax OK"

      - name: Build image (no push)
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile -- skipping build"
            exit 0
          fi

          # Prefer docker if available (host socket mounted or DinD)
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "Docker daemon available -- using docker build"
            docker build --tag ci-verify:local .
            echo "Docker build succeeded"
            exit 0
          fi

          echo "Docker daemon not available -- using kaniko"

          # Use kaniko if pre-installed in runner image
          if command -v kaniko >/dev/null 2>&1; then
            kaniko \
              --context=. \
              --dockerfile=Dockerfile \
              --no-push \
              --cache=false
            echo "Kaniko build succeeded"
            exit 0
          fi

          # Install kaniko if neither docker nor kaniko available
          echo "Installing kaniko..."
          KANIKO_VERSION="1.23.2"
          wget -q "https://github.com/GoogleContainerTools/kaniko/releases/download/v${KANIKO_VERSION}/executor-v${KANIKO_VERSION}-linux-amd64.tar.gz" -O /tmp/kaniko.tar.gz
          tar -xzf /tmp/kaniko.tar.gz -C /tmp executor
          chmod +x /tmp/executor

          /tmp/executor \
            --context=. \
            --dockerfile=Dockerfile \
            --no-push \
            --cache=false
          echo "Kaniko build succeeded (downloaded)"
