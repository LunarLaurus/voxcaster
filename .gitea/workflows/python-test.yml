name: Python Test

on:
  push:
    branches: ["master", "main"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "setup.py"
  pull_request:
    types: [opened, synchronize, reopened]
    # No `branches:` filter — fire CI on any base, including stacked PRs
    # targeting a feature branch. Task 1301 fix. The push-side `branches:`
    # filter above stays: post-merge runs still gate on master/main only.
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "setup.py"

jobs:
  python-test:
    name: Python Test
    runs-on: fleet-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check for Python project
        id: check
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Python project files found -- skipping"
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true; fi
          pip install pytest 2>/dev/null || true

      - name: Lint (syntax check)
        if: steps.check.outputs.skip != 'true'
        run: |
          . .venv/bin/activate
          find . -name "*.py" -not -path "./.venv/*" -print0 | xargs -0 python -m py_compile 2>&1 || true

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: |
          . .venv/bin/activate
          if [ -d tests ] || [ -d test ] || find . -name "test_*.py" -not -path "./.venv/*" | grep -q .; then
            python -m pytest -v --tb=short
          else
            echo "No test files found -- skipping"
          fi
