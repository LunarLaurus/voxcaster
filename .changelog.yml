# Changelog configuration for Gitea changelog tool
# Place in repo root as .changelog.yml
# Usage: changelog generate -m=v1.0.0 -t=$GITEA_TOKEN

service: gitea
base-url: http://192.168.0.12:30008

groups:
  -
    name: Breaking Changes
    labels:
      - type/breaking
  -
    name: Features
    labels:
      - type/feature
  -
    name: Bug Fixes
    labels:
      - type/bug
  -
    name: Enhancements
    labels:
      - type/enhancement
      - type/refactor
  -
    name: Security
    labels:
      - type/security
  -
    name: Testing
    labels:
      - type/testing
  -
    name: Documentation
    labels:
      - type/docs
  -
    name: Build
    labels:
      - type/build
  -
    name: Other
    default: true

skip-labels: skip-changelog
